name: Export EARTH source
on:
  push:
    branches:
      - earth-static-preview-20260908
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-artifact@v4
        with:
          name: earth-source
          path: |
            index.html
            Dockerfile
