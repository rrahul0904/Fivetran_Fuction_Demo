name: Verify EARTH public preview
on:
  push:
    branches:
      - earth-static-preview-20260908
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify immutable public HTML
        shell: bash
        run: |
          set -euxo pipefail
          URL="https://rawcdn.githack.com/rrahul0904/Fivetran_Fuction_Demo/cbbdcb478c5237e852845ce6b65d14d7f660af3a/index.html"
          curl -fsSIL "$URL" -o headers.txt
          cat headers.txt
          grep -Eiq '^HTTP/.* 200' headers.txt
          grep -Eiq '^content-type: *text/html' headers.txt
          curl -fsSL "$URL" -o earth.html
          BYTES=$(wc -c < earth.html)
          echo "EARTH_BYTES=$BYTES"
          test "$BYTES" -gt 100000
          grep -q 'v11-git-static' earth.html
          grep -q 'EARTH — The making of home' earth.html
          ! grep -q 'Welcome to nginx' earth.html
      - name: Verify Earth texture CDN
        shell: bash
        run: |
          set -euxo pipefail
          for n in 93 57 49 16 1; do
            URL="https://earth-paleo-assets-staging.vercel.app/paleo/$n.jpg"
            CODE=$(curl -sS -o "/tmp/$n.jpg" -w '%{http_code}' "$URL")
            echo "PALEO_$n=$CODE bytes=$(wc -c < /tmp/$n.jpg)"
            test "$CODE" = "200"
            test "$(wc -c < /tmp/$n.jpg)" -gt 1000
          done
