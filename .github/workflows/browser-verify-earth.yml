name: Browser verify EARTH preview
on:
  push:
    branches:
      - earth-static-preview-20260908
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Render public preview
        shell: bash
        run: |
          set -euxo pipefail
          URL="https://htmlpreview.github.io/?https://github.com/rrahul0904/Fivetran_Fuction_Demo/blob/earth-static-preview-20260908/index.html"
          google-chrome --version
          timeout 60s google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --enable-unsafe-swiftshader \
            --use-angle=swiftshader \
            --ignore-gpu-blocklist \
            --window-size=1440,900 \
            --virtual-time-budget=18000 \
            --screenshot=earth-preview.png \
            --dump-dom "$URL" > earth-dom.html
          BYTES=$(wc -c < earth-preview.png)
          DOM_BYTES=$(wc -c < earth-dom.html)
          echo "SCREENSHOT_BYTES=$BYTES"
          echo "DOM_BYTES=$DOM_BYTES"
          test "$BYTES" -gt 10000
          test "$DOM_BYTES" -gt 50000
          grep -q 'data-build="v12-1-reference-shell"' earth-dom.html
          grep -q 'EARTH — The making of home' earth-dom.html
          ! grep -q 'Application failed to respond' earth-dom.html
          ! grep -q 'Welcome to nginx' earth-dom.html
      - name: Upload browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: earth-browser-evidence
          path: |
            earth-preview.png
            earth-dom.html
