name: Tune EARTH present orientation
on:
  push:
    branches:
      - earth-static-preview-20260908
permissions:
  contents: read
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - run: python -m pip install --quiet selenium
      - name: Capture pitch sweep
        shell: bash
        run: |
          cat > /tmp/tune.py <<'PY'
          import os,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          URL='https://htmlpreview.github.io/?https://github.com/rrahul0904/Fivetran_Fuction_Demo/blob/earth-static-preview-20260908/index.html'
          o=Options();o.binary_location=os.environ.get('CHROME_BIN','/opt/hostedtoolcache/setup-chrome/chromium/stable/x64/chrome')
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--enable-unsafe-swiftshader','--use-angle=swiftshader','--ignore-gpu-blocklist']:o.add_argument(a)
          d=webdriver.Chrome(options=o);d.set_window_size(1440,900);d.get(URL)
          WebDriverWait(d,30).until(lambda x:x.execute_script("return !!window.__EARTH_APP__?.globe?.ready"))
          time.sleep(1.2)
          script=r"""
          const yaw=arguments[0]*Math.PI/180,pitch=arguments[1]*Math.PI/180,g=window.__EARTH_APP__.globe;
          const axis=(ax,ay,az,a)=>{const l=Math.hypot(ax,ay,az)||1,s=Math.sin(a/2);return [ax/l*s,ay/l*s,az/l*s,Math.cos(a/2)]};
          const mul=(a,b)=>{const [ax,ay,az,aw]=a,[bx,by,bz,bw]=b;const q=[aw*bx+ax*bw+ay*bz-az*by,aw*by-ax*bz+ay*bw+az*bx,aw*bz+ax*by-ay*bx+az*bw,aw*bw-ax*bx-ay*by-az*bz];const l=Math.hypot(...q)||1;return q.map(v=>v/l)};
          g.quat=mul(axis(1,0,0,pitch),axis(0,1,0,yaw));g.focusTarget=null;g.focusFrom=null;g.requestDraw();
          """
          for pitch in [-20,-5,10,25]:
              d.execute_script(script,-150,pitch)
              time.sleep(1.2)
              d.save_screenshot(f'pitch-{pitch:+03d}.png')
          d.quit()
          PY
          CHROME_BIN="$(which chrome || which google-chrome || which chromium || true)" python /tmp/tune.py
      - uses: actions/upload-artifact@v4
        with:
          name: earth-orientation-variants
          path: 'pitch-*.png'
